name             = Dancer2-Session-Pg
author           = Mikko Johannes Koivunalho <mikko.koivunalho@iki.fi>
license          = Perl_5
copyright_holder = Mikko Koivunalho
copyright_year   = 2026
main_module      = lib/Dancer2/Session/Pg.pm
abstract         = PostgreSQL session backend for Dancer2
website          = https://metacpan.org/dist/Dancer2-Session-Pg

[Meta::Contributors]

[MetaResources]
homepage            = https://metacpan.org/dist/Dancer2-Session-Pg
bugtracker.web      = http://rt.cpan.org/NoAuth/Bugs.html?Dist=Dancer2-Session-Pg
bugtracker.mailto   = bug-Dancer2-Session-Pg@rt.cpan.org
repository.url      = https://github.com/mikkoi/dancer2-session-pg.git
repository.web      = https://github.com/mikkoi/dancer2-session-pg
repository.type     = git

[Keywords]
keywords = dancer2 session postgresql

[@Filter]
-bundle = @MIKKOI
-version = 0.005
; -remove = Test::Perl::Critic
-remove = Readme ; No need to include README file because we include the weaved README.md
-remove = PodWeaver
; -remove = PerlTidy

[Prereqs / DevelopSuggests]
Dist::Zilla::App::Command::podpreview   = 0.004
Dist::Zilla::App::Command::cover        = 0
Devel::Cover::Report::Codecov           = 0
Devel::Cover::Report::Coveralls         = 0
App::RewriteVersion                     = 1.000
; Perl Critic and a few extra policies preferred
Perl::Critic                            = 0
Perl::Critic::Bangs                     = 0
Perl::Tidy                              = 20260826
Git::Hooks                              = 4.0.0
Git::MoreHooks                          = 0.019

[Prereqs / TestRequires]
Test::Script = 1.26
Test2::Suite = 1.302200
Test2::V1 = 1.302200
Test2::Tools::GenTemp = 1.302200

[Prereqs / RuntimeRequires]
perl = v5.12

[Software::Policies / AIDisclosure]
version = 1.1
policy_attribute = ai_tools = Claude AI, Copilot and Gemini

[Software::Policies / CodeOfConduct]
class = ContributorCovenant
version = 2.1

[Software::Policies / Contributing]
version = 1.1
policy_attribute = ai_disclosure = 1
policy_attribute = ai_assisted = 1

[Software::Policies / License]
policy_attribute = perl_5_double_license = true

[Software::Policies / MaintainerSuccession]

[Software::Policies / Security]
policy_attribute = url = https://github.com/mikkoi/dancer2-session-pg/blob/main/SECURITY.md
policy_attribute = timeframe = 14 days
policy_attribute = perl_support_years = 10

[WeaveFile / README.md]

[Test::WeaveFile]

[GitHub::CreateRelease]
; repo = github_repo_name         ; optional
; repo_owner = github_owner_name  ; optional
remote_name = origin
; branch = main                   ; default = main
; notes_as_code = 1               ; default = 1 (true)
notes_from = ChangeLog   ; default = SignReleaseNotes
notes_file = Changes    ; default = Release-VERSION
github_notes = 1                ; default = 0 (false)
draft = 0                       ; default = 0 (false)
; hash_alg = sha256               ; default = sha256
; add_checksum = 1                ; default = 1 (true)
; org_id = some_id_identifier     ; default = github (~/.github-identity or ~/.github)
; title_template = Version RELEASE - TRIAL CPAN release      ; this is the default

[BumpVersionAfterRelease]

[Run::AfterRelease / Dzil_weave]
run = dzil weave

; commit source files after modification
[Git::Commit / CommitAfterBumpVersionAfterRelease] ; commit Changes (for new dev)
allow_dirty_match = (^lib/|^bin/)
commit_msg = Bump version
