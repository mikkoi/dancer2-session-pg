name: CI
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# A service container gives this workflow a RUNNING PostgreSQL reachable over
# the network. It does not give the build container the client library, and
# DBD::Pg is XS: it has to compile against libpq here, in the job's own
# container, or its Makefile.PL stops with "Path to pg_config?". Hence the
# apt-get step in every job that installs Perl dependencies.
#
# The test suite finds its cluster through libpq's own environment variables --
# t/lib/SessionPgTest/PgDB.pm runs `createdb` and then connects with a bare
# "dbi:Pg:dbname=..." and no user or password -- so the names that matter are
# PGHOST, PGPORT, PGUSER and PGPASSWORD. POSTGRES_* names are read by the
# postgres image when it initialises itself, and by nothing on this side.

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    container:
      image: perldocker/perl-tester:5.44
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7.0.1
      - id: pg-client
        name: Install libpq so DBD::Pg can compile
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends libpq-dev
      - id: run-tests
        name: Run Tests
        # No PG* variables and no service container, so the database tests skip
        # themselves here. This job answers "does the distribution build and do
        # its author tests pass"; the pg job below answers "does it work".
        env:
          PERL_USE_UNSAFE_INC: 0
          AUTHOR_TESTING: 1
          AUTOMATED_TESTING: 1
          EXTENDED_TESTING: 1
          RELEASE_TESTING: 1
        run: auto-build-and-test-dist
      - id: upload-artifact
        name: Upload Build
        uses: actions/upload-artifact@v7.0.2
        with:
          name: build_dir
          path: build_dir

  pg:
    name: PostgreSQL ${{ matrix.postgres }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      # One old server failing should not hide the result for the others.
      fail-fast: false
      matrix:
        postgres: ['14', '15', '16', '17', '18']
    container:
      image: perldocker/perl-tester:5.44
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7.0.1
      - id: pg-client
        name: Install libpq and the client tools
        # createdb and dropdb come from postgresql-client and are what
        # SessionPgTest::PgDB shells out to for its throwaway database.
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends libpq-dev postgresql-client
      - id: show-server
        name: Report the server actually under test
        run: psql -XAtc 'SELECT version();'
      - id: download-artifact
        name: Download Build
        uses: actions/download-artifact@v8.0.2
        with:
          name: build_dir
          path: .
      - id: install-deps
        name: Install deps
        run: cpan-install-dist-deps
      - id: test
        name: Test
        run: test-dist
        env:
          AUTHOR_TESTING: 0
          RELEASE_TESTING: 0

  coverage:
    name: Coverage
    needs: build
    runs-on: ubuntu-latest
    container:
      image: perldocker/perl-tester:5.44
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7.0.1
      - id: pg-client
        name: Install libpq and the client tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends libpq-dev postgresql-client
      - id: download-artifact
        name: Download Build
        uses: actions/download-artifact@v8.0.2
        with:
          name: build_dir
          path: .
      - id: install-deps
        name: Install deps
        run: cpan-install-dist-deps
      - id: test
        name: Test
        run: test-dist
        env:
          CODECOV_TOKEN: ${{secrets.CODECOV_TOKEN}}
          COVERALLS_TOKEN: ${{secrets.COVERALLS_REPO_TOKEN}}
